<!-- AI Chatbot Component -->
<div class="ai-chatbot-container">
    <!-- Chatbot Toggle Button -->
    <div class="chatbot-toggle" id="chatbotToggle" onclick="toggleChatbot()">
        <div class="chatbot-logo-icon">
            <i class="fas fa-robot"></i>
        </div>
        <div class="chatbot-tooltip">AI Financial Assistant</div>
    </div>

    <!-- Chatbot Window -->
    <div class="chatbot-window" id="chatbotWindow">
        <!-- Header -->
        <div class="chatbot-header">
            <div class="chatbot-title">
                <div class="chatbot-logo-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <span>PayRupee AI Assistant</span>
            </div>
            <button class="chatbot-close" onclick="closeChatbot()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Messages Container -->
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="welcome-message">
                <div class="ai-message">
                    <div class="message-content">
                        <div class="typing-indicator" id="typingIndicator">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="message-text" style="display: none;">
                            👋 Hello! I'm your AI Financial Assistant. I can help you with account information, spending analysis, virtual cards, and financial insights. How can I assist you today?
                        </div>
                    </div>
                    <div class="message-time"></div>
                </div>
            </div>
        </div>

        <!-- Quick Suggestions -->
        <div class="chatbot-suggestions" id="chatbotSuggestions">
            <button class="suggestion-btn" onclick="sendQuickMessage('What is my account balance?')">
                💰 Check Balance
            </button>
            <button class="suggestion-btn" onclick="sendQuickMessage('Show my recent transactions')">
                📊 Recent Transactions
            </button>
            <button class="suggestion-btn" onclick="sendQuickMessage('How are my virtual cards?')">
                💳 Virtual Cards
            </button>
            <button class="suggestion-btn" onclick="sendQuickMessage('Give me spending analysis')">
                📈 Spending Analysis
            </button>
            <button class="suggestion-btn" onclick="sendQuickMessage('Is my account secure?')">
                🔒 Security Status
            </button>
            <button class="suggestion-btn" onclick="sendQuickMessage('Give me savings advice')">
                💡 Savings Tips
            </button>
        </div>

        <!-- Input Area -->
        <div class="chatbot-input">
            <input type="text" id="chatbotInput" placeholder="Ask me about your finances..." maxlength="500">
            <button id="chatbotSendBtn" onclick="sendMessage()" disabled>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<style>

}

.chatbot-header {
    background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));

@keyframes pulse {
